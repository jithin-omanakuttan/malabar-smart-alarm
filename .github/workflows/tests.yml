name: Tests

# Kept separate from the alarm workflow so a failing test never blocks the
# 4 AM notification.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run unit tests (no network, no secrets)
        run: python -m unittest discover -s tests -t . -v
